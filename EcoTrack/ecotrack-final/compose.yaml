services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: dev
      MONGO_URL: mongodb://mongo:27017/
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
